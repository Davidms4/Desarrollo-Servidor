<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Formulario</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"></head>
<body><main class="container my-4"><h1>Datos personales</h1>
<form action="formulario.php" method="post">
<label class="form-label d-block">Nombre<input class="form-control" type="text" name="nombre" required></label>
<label class="form-label d-block">Apellidos<input class="form-control" type="text" name="apellidos" required></label>
<label class="form-label d-block">Email<input class="form-control" type="email" name="email" required></label>
<label class="form-label d-block">Página personal<input class="form-control" type="url" name="url" required></label>
<label class="form-label d-block">Convivientes<input class="form-control" type="number" name="convivientes" min="0" step="1" required></label>
<fieldset><legend>Sexo</legend><label class="me-3"><input class="form-check-input" type="radio" name="sexo" value="Hombre" required> Hombre</label><label class="me-3"><input class="form-check-input" type="radio" name="sexo" value="Mujer" required> Mujer</label><label class="me-3"><input class="form-check-input" type="radio" name="sexo" value="Otro" required> Otro</label></fieldset><fieldset><legend>Aficiones</legend><label class="me-3"><input class="form-check-input" type="checkbox" name="aficiones[]" value="Deporte"> Deporte</label><label class="me-3"><input class="form-check-input" type="checkbox" name="aficiones[]" value="Música"> Música</label><label class="me-3"><input class="form-check-input" type="checkbox" name="aficiones[]" value="Estudiar"> Estudiar</label><label class="me-3"><input class="form-check-input" type="checkbox" name="aficiones[]" value="Videojuegos"> Videojuegos</label></fieldset><label class="form-label d-block mt-3">Menú favorito<select class="form-select" name="menu[]" multiple><option value="Pizza">Pizza</option><option value="Bocata">Bocata</option><option value="Pasta">Pasta</option><option value="Arroz">Arroz</option></select></label><button class="btn btn-primary">Enviar</button></form></main></body></html>
